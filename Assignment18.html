<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project: Accessible Student Admission Page</title>
</head>
<body>
    <header align="center" style="background-color: rgb(16, 16, 108); color: white; margin: auto; padding: 15px; width: 100%;">
        <h1>XYZ College</h1>
    </header>
    <div>
        <h2>Courses and Fees</h2>

        <table border="1" cellpadding="10" cellspacing="0" align="center" width="50%" >
            <caption>Available Courses</caption>
            <tr style="background-color: gainsboro;">
                <th>Courses</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>
        </table>
        <br>
        <form action="">
            
        <fieldset style="margin: 15px 25%;">
            <legend>Application Form</legend>

            <label for="name">Name:</label><br>
            <input type="text" style="width: 240px; padding: 5px;"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" style="width: 240px; padding: 5px;"><br><br>
            Courses: <br>
            <select name="course">
                <option value="btech_cse">B.Tech CSE</option>
                <option value="bca">BCA</option>
            </select>
            <br><br>
            Statement: <br>
            <textarea name="statement" cols="70" rows="5"></textarea><br><br>

            <button>Apply</button>

        </fieldset>
        </form>

    </div>

    <footer align="center" style="background-color:rgb(16, 16, 108); color: white; margin: auto; padding: 15px; width=10%">&copy; 2026 College</footer>
</body>
</html>
