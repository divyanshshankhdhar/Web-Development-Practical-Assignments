<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered, Ordered and Description Lists</title>
</head>
<body>
    <!--Unordered list-->
    <h2>Unordered list</h2>
    <ul> <!--ul>li*4-->
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>CPP</li>
    </ul>

    <!--Ordered list-->
    <h2>Ordered list</h2>
    <ol> <!--ol>li*4-->
        <li>Sign In on Github</li>
        <li>Click on Profile icon</li>
        <li>Repositories</li>
        <li>Then New and make your Repos</li>
    </ol>

    <!--Description List-->
    <h2>Description List</h2>
    <dl> <!--dl>dt*2>dd-->
        <dt> HTML
            <dd>Hyper Text Markup language</dd>
        </dt>
        <dt> CSS
            <dd>Cascading Style Sheets</dd>
        </dt>
    </dl>

</body>
</html>
