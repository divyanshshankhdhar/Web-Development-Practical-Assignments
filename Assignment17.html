<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes and Input Validation</title>
</head>
<body>
    <form action="">
        <input type="text" placeholder="Full Name" required><br><br>
    <input type="email" placeholder="you@college.in" required><br><br>
    <input type="tel" placeholder="Mobile Number" maxlength="10" required><br><br>
    <input type="password" minlength="6" placeholder="Min 6 character" required><br> <br>
    <input type="number" placeholder="Age" required><br><br>
    <button>Register</button>
    </form>
    
</body>
</html>
