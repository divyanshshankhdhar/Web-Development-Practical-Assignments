<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia: Image, Video, Audio and YouTube</title>
</head>
<body>
    <!--Image-->
    <h2>Image</h2>
    <img src="https://static.toiimg.com/photo/109270441.cms" alt="Darjeeling" width="500">
    <br>
    <!--Video-->
    <video width="500" controls>Video 
        <source src="sample.mp4" type="video">
    </video>
    <br>
    <!--Audio-->
    <audio controls>Audio 
        <source src="audio.mp3" type="audio">
    </audio>
    <br>
    <!--Youtube Video-->
    <iframe src="https://www.youtube.com/embed/Onb6_bRJ0Bw" frameborder="0"></iframe>

</body>
</html>
